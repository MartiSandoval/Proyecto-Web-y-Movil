services:

  # ──────────────────────────────────────
  # Backend: Node.js + Express (nodejs-Muni/)
  # Iniciar solo: docker compose --profile backend up -d
  # ──────────────────────────────────────
  backend:
    profiles: ["backend", "full"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGIN=http://localhost
    # Eliminar ports, cambia acceso "http://localhost:8000" por "http://localhost/api" <- Más seguro, innecesario en entorno local y debugging
    ports:
      - "8000:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────
  # Frontend: React 19 + Ionic 8 + Vite → Nginx (Ionic-Muni/)
  # Iniciar solo: docker compose --profile frontend up -d
  # ──────────────────────────────────────
  frontend:
    profiles: ["frontend", "full"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost/api
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge